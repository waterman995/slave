name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fontconfig fonts-noto-cjk curl

      - name: Install fonts
        run: bash scripts/setup-fonts.sh

      - name: Syntax checks
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/tocfill.py

      - name: Skill smoke test
        run: bash scripts/smoke-test.sh

      - name: Sample booklet checks
        run: bash scripts/smoke-test.sh --html examples/sample.html --pdf examples/sample.pdf
